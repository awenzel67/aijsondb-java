<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI JSON DB Web - Excel Query Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding-top: 2rem; }
        .container { max-width: 800px; }
        .upload-section, .question-section { margin-bottom: 2rem; padding: 1.5rem; border: 1px solid #dee2e6; border-radius: 0.375rem; }
        .upload-section { background-color: #f8f9fa; }
        .answer-section { margin-top: 1.5rem; padding: 1.5rem; background-color: #e7f3ff; border-radius: 0.375rem; border: 1px solid #b3d9ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">AI JSON DB Web</h1>
        <p class="text-center text-muted mb-5">Upload an Excel file and ask questions in natural language</p>

        <!-- Success/Error Messages -->
        <div th:if="${message}" class="alert alert-success">
            <strong>Success!</strong> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            <strong>Error!</strong> <span th:text="${error}"></span>
        </div>

        <!-- File Upload Section -->
        <div class="upload-section">
            <h3>Upload Excel File</h3>
            <form action="/upload" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="file" class="form-label">Select Excel File:</label>
                    <input type="file" class="form-control" id="file" name="file" accept=".xlsx,.xls" required>
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </form>
            <div th:if="${fileUploaded}" class="mt-3 alert alert-info">
                File uploaded successfully! You can now ask questions.
            </div>
        </div>

        <!-- Question Section (only visible after file upload) -->
        <div class="question-section" th:if="${fileUploaded}">
            <h3>Ask a Question</h3>
            <form action="/ask" method="post">

                <!--<h5>AI Model Options</h5>-->
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="modelProvider" class="form-label">Model Provider:</label>
                        <select class="form-select" id="modelProvider" name="modelProvider">
                            <option value="OPENAI" th:selected="${options.modelProvider == T(com.aijsondbweb.model.Options.ModelProvider).OPENAI}">OpenAI</option>
                            <option value="MISTRAL" th:selected="${options.modelProvider == T(com.aijsondbweb.model.Options.ModelProvider).MISTRAL}">Mistral</option>
                            <option value="OLLAMA" th:selected="${options.modelProvider == T(com.aijsondbweb.model.Options.ModelProvider).OLLAMA}">Ollama</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="modelName" class="form-label">Model Name:</label>
                        <input type="text" class="form-control" id="modelName" name="modelName" 
                               th:value="${options.modelName}" placeholder="e.g., gpt-3.5-turbo">
                    </div>
                    <div class="col-md-4">
                        <label for="apiKey" class="form-label">API Key:</label>
                        <input type="password" class="form-control" id="apiKey" name="apiKey" 
                               th:value="${options.apiKey}" placeholder="Enter API key">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="question" class="form-label">Your Question:</label>
                    <textarea class="form-control" id="question" name="question" rows="3" required></textarea>
                </div>

               

                <button type="submit" class="btn btn-success">Ask Question</button>
            </form>
        </div>

        <!-- Answer Section -->
        <div class="answer-section" th:if="${answer}">
            <h4>Answer:</h4>
            <p th:text="${answer}"></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
